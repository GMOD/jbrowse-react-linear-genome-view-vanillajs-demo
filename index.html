<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>JBrowse linear genome view from a script tag</title>
    <script
      src="https://unpkg.com/@jbrowse/react-linear-genome-view2@next/dist/react-linear-genome-view.umd.production.min.js"
      crossorigin
    ></script>
  </head>

  <body>
    <h2>JBrowse linear genome view from a script tag</h2>
    <div id="jbrowse_linear_genome_view"></div>
    <h3>Control the view</h3>
    <p>Each button navigates the view to that gene.</p>
    <button data-loc="10:94,762,681..94,855,547">CYP2C19</button>
    <button data-loc="13:32,315,086..32,400,266">BRCA2</button>
    <p>Showing: <span id="location"></span></p>
    <h3>Code</h3>
    <p>
      The code for this page is at
      <a href="https://github.com/GMOD/jbrowse-react-linear-genome-view-vanillajs-demo">
        https://github.com/GMOD/jbrowse-react-linear-genome-view-vanillajs-demo
      </a>
    </p>
    <h3>See the state</h3>
    <button id="show_session">Show session</button>
    <textarea id="session" rows="20" cols="80" readonly></textarea>
    <script>
      const { createLinearGenomeView } = JBrowseReactLinearGenomeView

      const assembly = {
        name: 'hg38',
        uri: 'https://jbrowse.org/genomes/GRCh38/fasta/hg38.prefix.fa.gz',
        refNameAliases: {
          uri: 'https://jbrowse.org/genomes/GRCh38/hg38_aliases.txt',
        },
        cytobands: {
          uri: 'https://jbrowse.org/genomes/GRCh38/cytoBand.txt',
        },
        geneticCodes: { chrM: 2 },
      }

      const tracks = [
        {
          trackId: 'ncbi_genes',
          name: 'NCBI RefSeq Genes',
          category: ['Genes'],
          uri: 'https://jbrowse.org/genomes/GRCh38/ncbi_refseq/GCA_000001405.15_GRCh38_full_analysis_set.refseq_annotation.sorted.gff.gz',
          textSearching: {
            textSearchAdapter: {
              uri: 'https://jbrowse.org/genomes/GRCh38/ncbi_refseq/trix/GCA_000001405.15_GRCh38_full_analysis_set.refseq_annotation.sorted.gff.gz.ix',
            },
          },
        },
        {
          trackId: 'repeats_hg38',
          name: 'Repeats',
          category: ['Annotation'],
          uri: 'https://jbrowse.org/genomes/GRCh38/repeats.bb',
        },
        {
          trackId: 'NA12878_exome',
          name: 'NA12878 Exome',
          category: ['1000 Genomes', 'Alignments'],
          uri: 'https://jbrowse.org/genomes/GRCh38/alignments/NA12878/NA12878.alt_bwamem_GRCh38DH.20150826.CEU.exome.cram',
        },
        {
          trackId: '1000g_vcf',
          name: '1000 Genomes Variant Calls',
          category: ['1000 Genomes', 'Variants'],
          uri: 'https://jbrowse.org/genomes/GRCh38/variants/ALL.wgs.shapeit2_integrated_snvindels_v2a.GRCh38.27022019.sites.vcf.gz',
        },
        {
          trackId: 'phyloP100way',
          name: 'hg38.100way.phyloP100way',
          category: ['Conservation'],
          uri: 'https://hgdownload.soe.ucsc.edu/goldenpath/hg38/phyloP100way/hg38.phyloP100way.bw',
        },
      ]

      const controller = createLinearGenomeView(
        document.getElementById('jbrowse_linear_genome_view'),
        {
          assembly,
          tracks,
          location: '10:29,838,565..29,838,850',
          onLocationChange: location => {
            document.getElementById('location').textContent = location
          },
        },
      )

      for (const button of document.querySelectorAll('button[data-loc]')) {
        button.addEventListener('click', () => {
          controller.update({ location: button.dataset.loc })
        })
      }

      document.getElementById('show_session').addEventListener('click', () => {
        controller.whenReady().then(state => {
          document.getElementById('session').value = JSON.stringify(
            state.session,
            undefined,
            2,
          )
        })
      })
    </script>
  </body>
</html>
